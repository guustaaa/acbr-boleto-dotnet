name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: restore · build · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ACBrBoleto.sln

      - name: Build
        run: dotnet build ACBrBoleto.sln -c Release --no-restore

      # A ACBrLibBoleto64 nativa não é redistribuível e não existe no runner. A suíte é
      # deliberadamente independente dela: a política do pool é exercitada via seam de
      # teste (ver docs/adr/0001-pool-de-handles-limitado.md).
      - name: Test
        run: >
          dotnet test ACBrBoleto.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 30
